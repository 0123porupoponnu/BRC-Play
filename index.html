<!doctype html><html lang=ja><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><meta name=theme-color content=#0B5CAD><link rel=manifest href=manifest.json><title>BRC Play v0.2</title><style>body{margin:0;font-family:-apple-system,sans-serif;background:linear-gradient(160deg,#0B5CAD,#3AA0FF);color:#fff}.w{max-width:560px;margin:auto;padding:20px}.h{text-align:center}.h img{width:110px;border-radius:24px}.c{background:rgba(255,255,255,.14);backdrop-filter:blur(10px);border-radius:22px;padding:18px;margin:16px 0}button{width:100%;padding:14px;border:0;border-radius:14px;background:#fff;color:#0B5CAD;font-weight:700;margin-top:10px}input{width:100%;padding:12px;border:0;border-radius:12px;box-sizing:border-box;margin-top:8px}.m{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid rgba(255,255,255,.15)}.s{font-size:14px;opacity:.75}</style></head><body><div class=w><div class=h><img src='assets/icon.png'><h1>BRC Play</h1><div>Version 0.2</div></div><div class=c><h2>👥 メンバー登録</h2><input id=name placeholder='表示名（例：ゆかりん）'><button onclick=add()>メンバーを追加</button></div><div class=c><h2>📋 メンバー一覧</h2><input id=search placeholder='メンバー検索' oninput=render()><div id=list></div></div><div class=c><h2>🏰 カルカソンヌ</h2><div class=s>v0.3で対戦入力を追加予定</div></div><div class=c><h2>🎲 ラミィキューブ</h2><div class=s>v0.4で練習会入力を追加予定</div></div><div class=s style='text-align:center'>BRC Play v0.2</div></div><script>let db=JSON.parse(localStorage.getItem('brc-play-v02')||'{"members":[]}');const save=()=>localStorage.setItem('brc-play-v02',JSON.stringify(db));function add(){const n=name.value.trim();if(!n)return;if(db.members.some(m=>m.name===n)){alert('同じ名前があります');return;}db.members.push({name:n,carc:1000,rami:1000});name.value='';save();render();}function del(i){if(confirm(db.members[i].name+' を削除しますか？')){db.members.splice(i,1);save();render();}}function edit(i){const v=prompt('表示名を変更',db.members[i].name);if(v&&v.trim()){db.members[i].name=v.trim();save();render();}}function render(){const q=search.value.toLowerCase();list.innerHTML='';db.members.filter(m=>m.name.toLowerCase().includes(q)).forEach((m,i)=>list.innerHTML+=`<div class=m><div><b>${m.name}</b><br><span class=s>カルカソンヌ ${m.carc} / ラミィ ${m.rami}</span></div><div><button style='width:auto;padding:8px 10px' onclick='edit(${i})'>✏️</button><button style='width:auto;padding:8px 10px;background:#E53935;color:white' onclick='del(${i})'>🗑️</button></div></div>`);}render();if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');</script></body></html>
