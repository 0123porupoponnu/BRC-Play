
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRC Play</title>

  <style>
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;
      background:linear-gradient(160deg,#0B5CAD,#3AA0FF);
      color:white;
    }

    .container{
      max-width:500px;
      margin:auto;
      padding:24px;
    }

    .header{
      text-align:center;
      margin-top:30px;
    }

    .header img{
      width:120px;
      border-radius:28px;
      box-shadow:0 10px 30px rgba(0,0,0,.3);
    }

    h1{
      margin:18px 0 4px;
      font-size:36px;
    }

    .sub{
      opacity:.85;
      margin-bottom:30px;
    }

    .card{
      background:rgba(255,255,255,.15);
      backdrop-filter:blur(10px);
      border-radius:22px;
      padding:18px;
      margin-bottom:16px;
      font-size:20px;
      font-weight:600;
    }

    .coming{
      text-align:center;
      margin-top:40px;
      opacity:.75;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <img src="assets/icon.png" alt="BRC">
    <h1>BRC Play</h1>
    <div class="sub">Rummikub & Carcassonne</div>
  </div>

  <div class="card">🏰 カルカソンヌ</div>
  <div class="card">🎲 ラミィキューブ</div>
  <div class="card">👥 メンバー</div>
  <div class="card">⚙️ 設定</div>

  <div class="coming">
    Version 0.1
  </div>

</div>

</body>
</html>
