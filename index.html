<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRC Play</title><link rel="manifest" href="manifest.json"><style>
body{font-family:-apple-system,sans-serif;margin:0;background:linear-gradient(160deg,#0B5CAD,#3AA0FF);color:white}
.wrap{max-width:700px;margin:auto;padding:20px}.card{background:rgba(255,255,255,.14);backdrop-filter:blur(10px);border-radius:22px;padding:18px;margin:14px 0}
button{width:100%;padding:16px;border:0;border-radius:16px;font-size:18px;background:#fff;color:#0B5CAD;font-weight:bold;margin:8px 0}
input{width:100%;padding:12px;border-radius:12px;border:0}
table{width:100%;color:white;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid rgba(255,255,255,.2)}
.small{font-size:14px;opacity:.8}
</style></head><body><div class="wrap">
<div style="text-align:center"><img src="assets/icon.png" width="110" style="border-radius:24px"><h1>BRC Play</h1><div>Rummikub & Carcassonne</div></div>
<div class="card"><h2>👥 メンバー</h2><input id=name placeholder="名前"><button onclick="addMember()">追加</button><div id=members></div></div>
<div class="card"><h2>🏰 カルカソンヌ（Elo）</h2><div id=carc></div></div>
<div class="card"><h2>🎲 ラミィキューブ（練習会）</h2><div class=small>4人の公式スコア入力→累計保存（TrueSkill計算は次版で本実装）</div><div id=rami></div></div>
<script>
let db=JSON.parse(localStorage.getItem('brcplay')||'{"members":[],"rami":[]}');
const save=()=>localStorage.setItem('brcplay',JSON.stringify(db));
const elo=(a,b,r)=>{let ea=1/(1+10**((b-a)/400));return Math.round(a+32*(r-ea));}
function render(){
 members.innerHTML=db.members.map((m,i)=>`<div class=card><b>${m.name}</b><br>カルカソンヌ ${m.carc||1000} / ラミィ ${m.rami||1000}<br><button onclick="del(${i})">削除</button></div>`).join('');
 let opts=db.members.map((m,i)=>`<option value=${i}>${m.name}</option>`).join('');
 carc.innerHTML=db.members.length<2?'2人以上登録してね':`<select id=a>${opts}</select><select id=b>${opts}</select><button onclick="win()">勝者=A</button><button onclick="lose()">勝者=B</button>`;
 rami.innerHTML=db.members.length<4?'4人以上登録してね':`<select id=r1>${opts}</select><input id=s1 placeholder="公式スコア 例:58"><select id=r2>${opts}</select><input id=s2 placeholder="-8"><select id=r3>${opts}</select><input id=s3 placeholder="-20"><select id=r4>${opts}</select><input id=s4 placeholder="-30"><button onclick="ramiSave()">練習会結果を追加</button><div class=small>登録済み: ${db.rami.length}卓</div>`;
}
function addMember(){if(!name.value)return;db.members.push({name:name.value,carc:1000,rami:1000});name.value='';save();render();}
function del(i){db.members.splice(i,1);save();render();}
function upd(awin){let i=+a.value,j=+b.value;if(i==j)return alert('別の人を選んでね');let A=db.members[i],B=db.members[j];let na=elo(A.carc,B.carc,awin?1:0),nb=elo(B.carc,A.carc,awin?0:1);A.carc=na;B.carc=nb;save();render();}
win=()=>upd(true);lose=()=>upd(false);
function ramiSave(){let arr=[[+r1.value,+s1.value],[+r2.value,+s2.value],[+r3.value,+s3.value],[+r4.value,+s4.value]].sort((x,y)=>y[1]-x[1]);db.rami.push(arr);save();render();alert('保存したよ！TrueSkill更新はv1.1で本実装予定');}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');
</script></div></body></html>
