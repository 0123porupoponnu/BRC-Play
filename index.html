<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B5CAD">
<title>BRC Play Build109</title>
<link rel="manifest" href="manifest.json">

<style>
body{margin:0;font-family:-apple-system,sans-serif;background:linear-gradient(160deg,#0B5CAD,#3AA0FF);color:#fff}
.w{max-width:640px;margin:auto;padding:18px}
.card{background:rgba(255,255,255,.14);backdrop-filter:blur(12px);border-radius:22px;padding:18px;margin:16px 0}
.h{text-align:center}
.h img{width:100px;border-radius:22px}
input,select{width:100%;padding:12px;border:0;border-radius:14px;box-sizing:border-box;font-size:16px}
button{padding:12px 16px;border:0;border-radius:14px;font-weight:700}
.primary{background:#fff;color:#0B5CAD;width:100%;margin-top:10px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.member{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.iconbtn{width:38px;height:38px;border-radius:10px;padding:0}
.edit{background:rgba(255,255,255,.18);color:#fff}
.del{background:#E53935;color:#fff}
.history{padding:12px;border-radius:14px;background:rgba(255,255,255,.08);margin-bottom:10px}
.small{font-size:13px;opacity:.8}
</style>
</head>

<body>

<div class="w">

<div class="h">
<img src="assets/icon.png">
<h1>BRC Play</h1>
<div>Build109</div>
</div>

<div class="card">
<h2>👥 メンバー登録</h2>
<input id="memberName" placeholder="表示名">
<button class="primary" id="addBtn">メンバー追加</button>
<div id="members"></div>
</div>

<div class="card">
<h2>🏰 カルカソンヌ（Elo）</h2>

<div class="row">
<select id="playerA"></select>
<select id="playerB"></select>
</div>

<div class="row" style="margin-top:10px">
<select id="turnA">
<option>先手</option>
<option>後手</option>
</select>

<select id="turnB">
<option>先手</option>
<option selected>後手</option>
</select>
</div>

<div class="row" style="margin-top:10px">
<input id="scoreA" inputmode="numeric" placeholder="A得点">
<input id="scoreB" inputmode="numeric" placeholder="B得点">
</div>

<button class="primary" id="saveMatch">結果を登録</button>
<div class="small">同点なら後手勝ち・得失点差も記録</div>
</div>

<div class="card">
<h2>📜 対戦履歴</h2>
<div id="history"></div>
</div>

<div class="card">
<h2>🎲 ラミィキューブ（v0.4.5）</h2>

<div class="row">
<select id="r1"></select>
<select id="r2"></select>
</div>

<div class="row" style="margin-top:10px">
<select id="r3"></select>
<select id="r4"></select>
</div>

<div class="row" style="margin-top:10px">
<input id="rs1" type="text" placeholder="1人目">
<input id="rs2" type="text" placeholder="2人目">
</div>

<div class="row" style="margin-top:10px">
<input id="rs3" type="text" placeholder="3人目">
<input id="rs4" type="text" placeholder="4人目">
</div>

<button class="primary" id="saveRummy">卓結果を保存</button>
<div class="small">公式スコア入力 → 合計点で順位作成（同点タイ）</div>
</div>

<div class="card">
<h2>🏆 ラミィ順位</h2>
<div id="ranking"></div>
</div>

<div class="small" style="text-align:center">BRC Play Build109</div>

</div>

<script>
const KEY='brc-play-v033';
const $=id=>document.getElementById(id);

let db=JSON.parse(localStorage.getItem(KEY)||'{"members":[],"history":[],"rummy":[]}');

if(!db.members) db.members=[];
if(!db.history) db.history=[];
if(!db.rummy) db.rummy=[];

const save=()=>localStorage.setItem(KEY,JSON.stringify(db));

const elo=(r1,r2,s)=>Math.max(0,Math.round(r1+32*(s-(1/(1+Math.pow(10,(r2-r1)/400))))));

function render(){

$('members').innerHTML='';

db.members.forEach((m,i)=>{

const row=document.createElement('div');
row.className='member';

row.innerHTML=`
<div>
<b>${m.name}</b>
<div class=small>レート ${m.carc||1000}</div>
</div>`;

const box=document.createElement('div');
box.style.display='flex';
box.style.gap='8px';

const e=document.createElement('button');
e.className='iconbtn edit';
e.textContent='✏️';
e.onclick=()=>{
const v=prompt('表示名を変更',m.name);
if(v&&v.trim()){
m.name=v.trim();
save();
render();
}
};

const d=document.createElement('button');
d.className='iconbtn del';
d.textContent='🗑️';
d.onclick=()=>{
if(confirm(m.name+' を削除しますか？')){
db.members.splice(i,1);
save();
render();
}
};

box.append(e,d);
row.append(box);
$('members').append(row);

});

const opts=db.members.map((m,i)=>`<option value="${i}">${m.name}</option>`).join('');

$('playerA').innerHTML=opts;
$('playerB').innerHTML=opts;

['r1','r2','r3','r4'].forEach(id=>{
$(id).innerHTML=opts;
});

if(db.history.length){

$('history').innerHTML=db.history.slice().reverse().map((h,i)=>`
<div class=history>

<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">

<div style="flex:1">
👑 <b>${h.winner}</b>（${h.wTurn}）<br>
<b>${h.scoreA}-${h.scoreB}</b> 得失点差 ${h.diffText}<br>
<span class=small>${h.a} ${h.ra1}→${h.ra2} / ${h.b} ${h.rb1}→${h.rb2}</span>
</div>

<button class="iconbtn del" onclick="deleteHistory(${db.history.length-1-i})">🗑️</button>

</div>

</div>`).join('');

}else{

$('history').innerHTML='<div class=small>まだ対戦記録はありません</div>';

}

const totals={};

db.members.forEach(m=>totals[m.name]=0);

db.rummy.forEach(g=>{
g.forEach(p=>{
totals[p.name]=(totals[p.name]||0)+p.score;
});
});

const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]);

$('ranking').innerHTML=sorted.length
?sorted.map((e,i)=>`
<div class=history>
${i+1}位 <b>${e[0]}</b><br>
<span class=small>${e[1]}点</span>
</div>`).join('')
:'<div class=small>まだラミィの記録はありません</div>';

}

function deleteHistory(index){

if(!confirm('この対戦履歴を削除しますか？')) return;

db.history.splice(index,1);

save();

render();

}

$('addBtn').onclick=()=>{

const n=$('memberName').value.trim();

if(!n)return;

if(db.members.some(m=>m.name===n)){
alert('同じ名前があります');
return;
}

db.members.push({name:n,carc:1000});

$('memberName').value='';

save();

render();

};

$('saveMatch').onclick=()=>{

const ai=+$('playerA').value;
const bi=+$('playerB').value;

if(ai===bi){
alert('別のメンバーを選んでね');
return;
}

const sa=Number($('scoreA').value);
const sb=Number($('scoreB').value);

if(Number.isNaN(sa)||Number.isNaN(sb)){
alert('得点を入力してね');
return;
}

const ta=$('turnA').value;
const tb=$('turnB').value;

if(ta===tb){
alert('先手と後手を分けてね');
return;
}

const aWin=sa>sb||(sa===sb&&ta==='後手');

const A=db.members[ai];
const B=db.members[bi];

const oa=A.carc||1000;
const ob=B.carc||1000;

A.carc=elo(oa,ob,aWin?1:0);
B.carc=elo(ob,oa,aWin?0:1);

const diff=sa-sb;

db.history.push({
a:A.name,
b:B.name,
winner:aWin?A.name:B.name,
wTurn:aWin?ta:tb,
scoreA:sa,
scoreB:sb,
diffText:(diff>0?`A +${diff} / B -${diff}`:diff<0?`A ${diff} / B +${-diff}`:'±0'),
ra1:oa,
ra2:A.carc,
rb1:ob,
rb2:B.carc
});

save();

render();

$('scoreA').value='';
$('scoreB').value='';

alert('結果を登録したよ！');

};

$('saveRummy').onclick=()=>{

const ids=[
$('r1').value,
$('r2').value,
$('r3').value,
$('r4').value
];

if(new Set(ids).size!==4){
alert('4人とも別のメンバーを選んでね');
return;
}

const scores=[
Number($('rs1').value),
Number($('rs2').value),
Number($('rs3').value),
Number($('rs4').value)
];

if(scores.some(Number.isNaN)){
alert('4人分の得点を入力してね');
return;
}

const game=ids.map((id,i)=>({
name:db.members[id].name,
score:scores[i]
})).sort((a,b)=>b.score-a.score);

db.rummy.push(game);

save();

render();

['rs1','rs2','rs3','rs4'].forEach(id=>$(id).value='');

alert('ラミィの卓結果を保存したよ！');

};

render();

if('serviceWorker' in navigator){
navigator.serviceWorker.register('service-worker.js');
}

</script>

</body>
</html>
