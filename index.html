<!doctype html><html lang=ja><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>BRC Play v0.3.1</title><style>body{margin:0;font-family:-apple-system,sans-serif;background:linear-gradient(160deg,#0B5CAD,#3AA0FF);color:#fff}.w{max-width:620px;margin:auto;padding:18px}.card{background:rgba(255,255,255,.14);backdrop-filter:blur(12px);border-radius:22px;padding:18px;margin:16px 0}.h{text-align:center}.h img{width:100px;border-radius:22px}input,select{width:100%;padding:12px;border:0;border-radius:14px;box-sizing:border-box;font-size:16px}button{padding:12px 16px;border:0;border-radius:14px;font-weight:700}.primary{background:#fff;color:#0B5CAD;width:100%;margin-top:10px}.row{display:flex;gap:10px}.row>*{flex:1}.member{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.12)}.iconbtn{width:38px;height:38px;border-radius:10px;padding:0}.edit{background:rgba(255,255,255,.18);color:#fff}.del{background:#E53935;color:#fff}.history{padding:12px;border-radius:14px;background:rgba(255,255,255,.08);margin-bottom:10px}.small{font-size:13px;opacity:.8}</style></head><body><div class=w><div class=h><img src='assets/icon.png'><h1>BRC Play</h1><div>Version 0.3.1</div></div><div class=card><h2>👥 メンバー登録</h2><input id=name placeholder='表示名'><button class=primary id=add>メンバー追加</button><div id=members></div></div><div class=card><h2>🏰 カルカソンヌ（Elo）</h2><div class=row><select id=a></select><select id=b></select></div><div class=row style='margin-top:12px'><button class=primary id=wa>Aが勝ち</button><button class=primary id=wb>Bが勝ち</button></div><div class=small>初期1000・K=32・最低0</div></div><div class=card><h2>📜 対戦履歴</h2><div id=history></div></div><div class=card><h2>🎲 ラミィキューブ</h2><div class=small>v0.4で練習会機能を実装予定</div></div><div class=small style='text-align:center'>BRC Play v0.3.1</div></div><script>const KEY='brc-play-v031';let db=JSON.parse(localStorage.getItem(KEY)||'{"members":[],"history":[]}');const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const elo=(r1,r2,s)=>Math.max(0,Math.round(r1+32*(s-(1/(1+Math.pow(10,(r2-r1)/400))))));function render(){members.innerHTML='';db.members.forEach((m,i)=>{const row=document.createElement('div');row.className='member';row.innerHTML=`<div><b>${m.name}</b><div class=small>レート ${m.carc||1000}</div></div>`;const box=document.createElement('div');box.style.display='flex';box.style.gap='8px';const e=document.createElement('button');e.className='iconbtn edit';e.textContent='✏️';e.onclick=()=>{const v=prompt('表示名を変更',m.name);if(v&&v.trim()){m.name=v.trim();save();render();}};const d=document.createElement('button');d.className='iconbtn del';d.textContent='🗑️';d.onclick=()=>{if(confirm(m.name+' を削除しますか？')){db.members.splice(i,1);save();render();}};box.append(e,d);row.append(box);members.append(row);});const opts=db.members.map((m,i)=>`<option value=${i}>${m.name}</option>`).join('');a.innerHTML=opts;b.innerHTML=opts;history.innerHTML=db.history.length?db.history.slice().reverse().map(h=>`<div class=history>👑 <b>${h.winner}</b><div class=small>${h.a} ${h.ra1}→${h.ra2} / ${h.b} ${h.rb1}→${h.rb2}</div></div>`).join(''):'<div class=small>まだ対戦記録はありません</div>';}add.onclick=()=>{const n=name.value.trim();if(!n)return;if(db.members.some(m=>m.name===n)){alert('同じ名前があります');return;}db.members.push({name:n,carc:1000});name.value='';save();render();};function match(aWin){const ai=+a.value,bi=+b.value;if(ai===bi)return alert('別のメンバーを選んでね');const A=db.members[ai],B=db.members[bi];const oa=A.carc||1000,ob=B.carc||1000;A.carc=elo(oa,ob,aWin?1:0);B.carc=elo(ob,oa,aWin?0:1);db.history.push({a:A.name,b:B.name,winner:aWin?A.name:B.name,ra1:oa,ra2:A.carc,rb1:ob,rb2:B.carc});save();render();alert('保存したよ！');}wa.onclick=()=>match(true);wb.onclick=()=>match(false);render();if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');</script></body></html>
