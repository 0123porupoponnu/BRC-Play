
<!doctype html><html lang=ja><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>BRC Play Build100</title><link rel=manifest href=manifest.json><link rel=stylesheet href=css/style.css></head><body>
<div id=drawer class=drawer><h2>BRC Play</h2><div class=item onclick="show('home')">🏠 ホーム</div><div class=item onclick="show('carc')">🏰 カルカソンヌ</div><div class=item onclick="show('rummy')">🎲 ラミィキューブ</div><div class=item onclick="show('member')">👥 メンバー</div><div class=item onclick="show('settings')">⚙️ 設定</div></div>

<section id=home class="screen active">
<div class=top><div onclick=toggleMenu()>☰</div><img src=assets/icon.png class=logo><div>⚙️</div></div>
<div class=card><h1>BRC Play</h1><p>Build100 ホーム</p></div>
<div class=card><h2>📅 今日の練習会</h2><p>続きから始める</p></div>
<div class=grid>
<div class=tile onclick="show('carc')">🏰<br>カルカソンヌ</div>
<div class=tile onclick="show('rummy')">🎲<br>ラミィキューブ</div>
<div class=tile onclick="show('member')">👥<br>メンバー</div>
<div class=tile onclick="show('settings')">⚙️<br>設定</div>
</div></section>

<section id=carc class=screen><div class=top><div onclick="show('home')">←</div><h2>カルカソンヌ</h2><div></div></div><div class=card>ここにv0.4.5のカルカソンヌ機能を移植予定。</div></section>
<section id=rummy class=screen><div class=top><div onclick="show('home')">←</div><h2>ラミィキューブ</h2><div></div></div><div class=card>ここにv0.4.5のラミィ機能を移植予定。</div></section>
<section id=member class=screen><div class=top><div onclick="show('home')">←</div><h2>メンバー</h2><div></div></div><div class=card>メンバー画面。</div></section>
<section id=settings class=screen><div class=top><div onclick="show('home')">←</div><h2>設定</h2><div></div></div><div class=card>バックアップ等は次のBuildで追加。</div></section>

<script src=js/app.js></script></body></html>
