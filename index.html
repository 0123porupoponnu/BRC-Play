<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRC Play Build102</title><style>
body{margin:0;font-family:-apple-system,sans-serif;background:linear-gradient(160deg,#0B5CAD,#3AA0FF);color:#fff}
.page{max-width:720px;margin:auto;padding:20px}.screen{display:none}.active{display:block}.card{background:rgba(255,255,255,.14);backdrop-filter:blur(12px);border-radius:24px;padding:20px;margin:16px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{background:rgba(255,255,255,.12);border-radius:18px;padding:28px 14px;text-align:center;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center}.logo{width:62px;border-radius:18px}
input,select,button{width:100%;padding:12px;border:0;border-radius:14px;box-sizing:border-box;font-size:16px}
button{background:#fff;color:#0B5CAD;font-weight:700}.row{display:flex;gap:10px}.row>*{flex:1}.back{cursor:pointer;font-weight:700}
</style></head><body><div class="page">
<section id=home class="screen active"><div class=top><div><h1 style="margin:0">BRC Play</h1><div>Rummikub & Carcassonne</div></div><img src="assets/icon.png" class=logo></div>
<div class=card><h2>📅 今日の練習会</h2><div id=today>今日はまだ対戦なし</div></div>
<div class=grid><div class=tile onclick="show('carc')">🏰<br>カルカソンヌ</div><div class=tile onclick="show('rummy')">🎲<br>ラミィキューブ</div><div class=tile onclick="show('member')">👥<br>メンバー</div><div class=tile onclick="show('settings')">⚙️<br>設定</div></div></section>
<section id=rummy class=screen><div class=back onclick="show('home')">← ホーム</div><div class=card><h2>🎲 ラミィキューブ</h2><div class=row><select><option>ゆかり</option></select><select><option>ひがし</option></select></div><div class=row style="margin-top:10px"><select><option>みどり</option></select><select><option>ゲスト</option></select></div><div class=row style="margin-top:10px"><input type=text inputmode=text placeholder="1人目"><input type=text inputmode=text placeholder="2人目"></div><div class=row style="margin-top:10px"><input type=text inputmode=text placeholder="3人目"><input type=text inputmode=text placeholder="4人目"></div><button style="margin-top:12px">卓結果を保存</button></div></section>
<section id=carc class=screen><div class=back onclick="show('home')">← ホーム</div><div class=card><h2>🏰 カルカソンヌ</h2><p>Build102ではv0.4.5のElo機能をここへ移植予定。</p></div></section>
<section id=member class=screen><div class=back onclick="show('home')">← ホーム</div><div class=card><h2>👥 メンバー</h2><p>既存メンバー機能をここへ移植予定。</p></div></section>
<section id=settings class=screen><div class=back onclick="show('home')">← ホーム</div><div class=card><h2>⚙️ 設定</h2><p>バックアップ・データ管理（予定）</p></div></section>
</div><script>function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active")}</script></body></html>
